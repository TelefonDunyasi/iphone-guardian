name: iPhoneGuardian
options:
  bundleIdPrefix: com.telefondunyasi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "iPhone Guardian"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
targets:
  iPhoneGuardian:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.telefondunyasi.iphoneguardian
        PRODUCT_NAME: "iPhone Guardian"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        SWIFT_EMIT_LOC_STRINGS: YES
